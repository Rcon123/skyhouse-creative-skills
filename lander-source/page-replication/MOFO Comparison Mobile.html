<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOFO Comparison — Mobile Preview</title>
<style>
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;background:#e7e5df;display:flex;flex-direction:column;align-items:center;gap:18px;padding:40px 20px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}
  h1{font-size:15px;font-weight:700;letter-spacing:.02em;color:#3a3a3a;margin:0;text-transform:uppercase;}
  p.note{margin:0 0 4px;font-size:13px;color:#777;}
  .phone{width:402px;max-width:100%;height:850px;background:#111;border-radius:46px;padding:12px;box-shadow:0 24px 60px rgba(0,0,0,.28);position:relative;flex:none;}
  .phone::before{content:"";position:absolute;top:20px;left:50%;transform:translateX(-50%);width:118px;height:26px;background:#111;border-radius:0 0 16px 16px;z-index:3;}
  .screen{width:100%;height:100%;border-radius:36px;overflow:hidden;background:#fff;}
  iframe{width:390px;height:100%;border:0;display:block;background:#fff;}
</style>
</head>
<body>
  <h1>MOFO Comparison — Mobile (390px)</h1>
  <p class="note">Scroll inside the phone to view the full page.</p>
  <div class="phone">
    <div class="screen">
      <iframe src="MOFO%20Comparison.dc.html" title="MOFO Comparison mobile"></iframe>
    </div>
  </div>
</body>
</html>
